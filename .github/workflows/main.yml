name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/kuronami69/MemKernel/main/kernel/setup.sh" | bash -s M

    - name: Install Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld

    - name: Configure Kernel
      run: |
        make vayu_defconfig  # Replace with your actual defconfig
        make oldconfig

    - name: Android kernel build with Clang
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
        CC: clang
        LD: ld.lld  # Use the LLVM linker
      with:
        arch: arm64
        compiler: clang  # Specify that you're using Clang as the compiler
        defconfig: vayu_defconfig  # Replace with your actual defconfig
        image: Image.gz-dtb

    - name: List Output Directory
      run: |
        echo "Listing contents of the output directory:"
        ls -R ./out/drivers/memkernel/

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: kernel-module
        path: |
          ./out/Image.gz-dtb  # Adjust this if necessary based on your build outputs
          ./out/drivers/memkernel/memkernel.ko
